[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dulus-bar"
version = "0.2.0"
description = "Dulus Bar — a cross-platform Dynamic Island for your AI agents (Windows / macOS / Linux)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dulus", email = "dev@dulus.ai"}]
keywords = [
    "ai", "agents", "overlay", "dynamic-island", "notch",
    "claude", "codex", "gemini", "cursor", "dulus",
    "windows", "macos", "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyQt6>=6.4.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    # Windows-only window management
    "pywin32>=306; sys_platform == 'win32'",
    # macOS notch detection + always-visible NSWindow behavior
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
dulusbar = "dulus_bar.main:main"

[project.urls]
Homepage = "https://bitbucket.org/dulus-ai/dulus-bar"
Repository = "https://bitbucket.org/dulus-ai/dulus-bar"

[tool.setuptools.packages.find]
include = ["dulus_bar*"]
exclude = ["wrappers*", "assets*", "dist*", "build*"]
